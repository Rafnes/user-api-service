databaseChangeLog:
  - changeSet:
      id: "001"
      author: "vdineka"
      changes:
        - createTable:
            tableName: "roles"
            columns:
              - column:
                  name: "UUID"
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: "role_name"
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true